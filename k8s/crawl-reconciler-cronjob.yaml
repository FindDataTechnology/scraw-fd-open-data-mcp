# Crawl-policy reconciler (add-multi-cluster-master-db; repointed to guangzhou-xinru).
#
# Runs on the CONTROL cluster (guangzhou-xinru k3s) in the fd-master namespace,
# against the canonical host-docker fd-postgres :30432 + fd-redis :30380 (mesh
# 100.64.0.3). Every 15 minutes: close finished policy_runs, then for each enabled
# crawl_policies row whose cron is due (policy timezone) and has no open run, compile
# a CrawlPlan and dispatch it to a worker cluster via MultiClusterLauncher (picks a
# cluster by tags + circuit state + load; creates a ConfigMap + Job on that remote
# cluster through its mounted kubeconfig).
#
# Apply AFTER the master stack (k8s/master/) is up:
#   kubectl apply -f k8s/crawl-reconciler-cronjob.yaml
# Run one tick manually:
#   kubectl create job --from=cronjob/crawl-reconciler crawl-reconciler-manual -n fd-master
#
# Onboarding a worker server:
#   1. k3s/k8s on the new server; create a ServiceAccount + token + clusterrolebinding.
#   2. Add the token + CA as keys in the worker-kubeconfigs Secret (one per cluster):
#        kubectl create secret generic worker-kubeconfigs -n fd-master \
#          --from-file=<cluster-name>.token=./token --from-file=<cluster-name>.ca=./ca.crt
#      (or `kubectl edit secret worker-kubeconfigs` to add keys for additional clusters)
#   3. INSERT INTO clusters (name, api_server, namespace, image, tags, capacity) VALUES (...)
#   4. The next reconciler tick (≤15 min) starts dispatching to it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crawl-reconciler
  namespace: fd-master
---
# Used only by the k8s (single-cluster, in-cluster) fallback launcher. The
# k8s-multi launcher reaches remote clusters via per-cluster kubeconfigs, not
# this local SA.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crawl-reconciler
  namespace: fd-master
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create", "get", "list"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crawl-reconciler
  namespace: fd-master
subjects:
- kind: ServiceAccount
  name: crawl-reconciler
  namespace: fd-master
roleRef:
  kind: Role
  name: crawl-reconciler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crawl-reconciler
  namespace: fd-master
  labels:
    app: crawl-reconciler
spec:
  schedule: "7,22,37,52 * * * *"   # every 15 min, off the :00/:15/:30/:45 marks
  suspend: false                   # resumed 2026-09-18 (fail-fast-permanent-fetch-errors verification; FD_CAPABILITY_CHECK=enforce live)
  concurrencyPolicy: Forbid        # one tick at a time (single-flight is per-policy)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: crawl-reconciler
          restartPolicy: OnFailure
          imagePullSecrets:
          - name: fd-harbor-pull
          containers:
          - name: reconciler
            # sha-1d8a70a = first fleet build that installs fd-open-data-mcp from a
            # PINNED COMMIT rather than PyPI. The released 0.5.61 carries no
            # retention code (no fetch/retention.py, no _snapshot_consolidate), so
            # before this bump the dispatcher and the workers it launched could not
            # enforce any contract. Roll only with a verified worker build.
            image: ccr.ccs.tencentyun.com/finddata/scraw-fd-open-data-mcp:sha-376700c
            # sha-fae6d2d carries fd-open-data-mcp 0.5.26 (concept-platform-
            # federation mirror: sibling-transaction writes, rows_written per
            # prod NOT NULL DEFAULT 0). Verified pullable from Harbor on xinru
            # 2026-09-27; IfNotPresent keeps warm restarts cheap.
            imagePullPolicy: IfNotPresent
            command: ["python", "-m", "fd_open_data_mcp.refresh.reconciler"]
            env:
            # Master control-plane DB via PgBouncer (the single source of truth).
            # Workers use the SAME endpoint (SCRAW_K8S_DATABASE_URL below).
            - name: FD_OPEN_DATA_MCP_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: fd-db-secret, key: DATABASE_URL}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: {name: fd-db-secret, key: REDIS_URL}  # redis://:pw@100.64.0.3:30380/0 (xinru fd-redis db0)
            # Scheduling-time is_selectable must see forwarder-written circuit
            # state (proxy-redis db1), else banned exits keep receiving jobs.
            - name: PROXY_REDIS_URL
              valueFrom:
                secretKeyRef: {name: fd-db-secret, key: PROXY_REDIS_URL_CONTROL}
            - name: RECONCILER_LAUNCHER
              value: "k8s-multi"
            # The DB + Redis URLs the worker Jobs use — same canonical xinru
            # endpoints (mesh 100.64.0.3), reachable from pods on every mesh node.
            # MultiClusterLauncher injects these into every spawned crawl Job.
            - name: SCRAW_K8S_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: fd-db-secret, key: DATABASE_URL}
            - name: SCRAW_K8S_REDIS_URL
              valueFrom:
                secretKeyRef: {name: fd-db-secret, key: REDIS_URL}
            - name: KUBECONFIG_DIR
              value: "/kubeconfigs"
            - name: POLICY_MAX_FETCHES
              value: "50000"
            # fail-fast-permanent-fetch-errors: plan-time exclusion of endpoints
            # unresolvable on the dispatch host (report = log-only default).
            - name: FD_CAPABILITY_CHECK
              value: "enforce"
            - name: PYTHONUNBUFFERED
              value: "1"
            # 2026-09-27: the following four were historically set out-of-band,
            # so re-applying this manifest silently stripped them (happened once
            # during the sha-d6cf0b3 roll; restored by patch from the last
            # pre-roll job spec). They now live IN the manifest — keep it the
            # faithful record; never let them drift out again.
            # 2026-11-06: DC_API_KEY moved to Secret `dc-api-key`
            # (harden-crawl-gitops-foundation 3.1) — plaintext left the manifest
            # on purpose; the Secret carries the same value until upstream
            # rotation (task 3.2). Do NOT inline it back.
            - name: DC_API_KEY
              valueFrom:
                secretKeyRef: {name: dc-api-key, key: DC_API_KEY}
            - name: FD_BINDING_ELIGIBILITY_GATE
              value: "enforce"
            - name: FD_SCRIPTS_DIR
              value: "/opt/fd-scripts/"
            # Worker pods' image — deliberately pinned separately from the
            # reconciler image; roll only with a verified worker build.
            # NOTE (2026-11-11): under RECONCILER_LAUNCHER=k8s-multi this value is
            # NOT what dispatched Jobs run — they use `clusters.image` from the DB
            # (reconciler.py `_scrapy_manifests` / direct path). It is the default
            # for the single-cluster launcher only. Kept aligned with the cluster
            # row anyway: a stale value here is the kind of "switch that looks
            # authoritative but is never read" that made the fleet bypass
            # retention for weeks. History: sha-2302fbe (2026-10-01, browser-free
            # [data] build, fd-open-data-mcp 0.5.34 floor).
            # 这个 pin **结构性地落后一拍**：每次 push 都会出片，而 pin 只能指向已经
            # 存在的 tag，所以它永远指着上一次发布。别为了追它再提交一次——追不完。
            # 真值始终是 DB 的 `clusters.image`（k8s-multi 下派活读那一行）。
            - name: SCRAW_K8S_IMAGE
              value: "ccr.ccs.tencentyun.com/finddata/scraw-fd-open-data-mcp:sha-eb366d0"
            # 留存闸门档位：`_common_env` 会把它**透传**给每个爬虫 Job（34d55b6）。
            # 不在这里设，Job 就落到默认 off——而集群才是大批量写观测的地方。
            # 档位与两份服务端清单保持一致（当前 warn）；切 enforce 前先确认医药域等
            # 活跃线的新族都已声明契约，否则它们的写入会静默失败（decisions §5.34）。
            - name: FD_RETENTION_GATE
              value: "warn"
            volumeMounts:
            - name: kubeconfigs
              mountPath: /kubeconfigs
              readOnly: true
            resources:
              requests: {memory: "128Mi", cpu: "100m"}
              limits: {memory: "512Mi", cpu: "500m"}
          volumes:
          - name: kubeconfigs
            secret:
              secretName: worker-kubeconfigs   # keys: <cluster>.token, <cluster>.ca
---
# Requires:
#   - the master stack (k8s/master/) deployed in fd-master
#   - master-db-secret (DATABASE_URL, POSTGRES_PASSWORD) + master-redis-secret (REDIS_URL, REDIS_PASSWORD)
#   - worker-kubeconfigs Secret (one <name>.token + <name>.ca per worker cluster)
#   - the clusters table populated (one row per worker cluster) + fd-open-data-mcp migrate run
# Local dev instead: RECONCILER_LAUNCHER=scrapyd python -m fd_open_data_mcp.refresh.reconciler
