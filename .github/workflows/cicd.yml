# DISABLED (2026-09-18): image builds are DOMESTIC-ONLY.
#
# Policy (user directive, 2026-09-10): GitHub-hosted runners must NEVER build or
# push to the domestic Harbor (23.144.68.246:30880, and this repo's
# 103.236.89.212:30874 endpoint) or any CN server — foreign runner IPs hammering
# domestic endpoints risk IP bans.
#
# Where this image is built instead: on the cheap-fleet box. The current channel
# is a box-side `docker build --build-arg FD_ODM_INSTALL=fd-open-data-mcp[data]`
# (the [data] extra must not be dropped), then `docker save | gzip` to the nodes
# and `k3s ctr -n k8s.io images import` (INFRA-NOTES.md, 镜像分发临时通道); the
# Harbor push resumes from the box once push credentials are reissued after the
# 2026-09-17 Harbor rebuild.
#
# The push-triggered job this replaces could not succeed on GitHub by
# construction: Dockerfile:51 COPYs vendor/fd-open-data-mcp, a local checkout
# that is deliberately not committed — run 35325169249 (2026-09-18) died on
# exactly that, and since the Harbor rebuild every documented push credential
# returns 401 anyway.
#
# This stub exists so the file path stays claimed and fails loudly if anyone
# re-points it at a registry.
name: Build & Push image to Harbor (disabled)

on: workflow_dispatch

jobs:
  refuse:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse
        run: |
          echo "::error::Image builds are domestic-only (cheap-fleet box). Do not re-enable pushes from GitHub runners."
          exit 1
