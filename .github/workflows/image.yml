# 共享实现见 FindDataTechnology/fd-ci（openspec: extract-shared-ci-workflow）。
#
# **本仓有一个必须在 push 之前跑的 Smoke gate**（openspec
# scraw-runner-image-regression）：构建出的镜像要能 import scrapy 且 `--help` 有响应，
# 否则不许推 tag —— 这正是 2026-10-01 w3lib 2.5 回归漏进机队的原因。
#
# 共享 workflow 为此有一个 `smoke_script` 输入：非空时它会把构建拆成
# 「本地 build → 跑这段脚本 → 复用 cache 推送」，脚本里可用 $IMG。
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: scraw-fd-open-data-mcp
      namespace: finddata
      smoke_script: |
        set -euo pipefail
        docker run --rm --entrypoint python "$IMG" -c "import scrapy; print('scrapy', scrapy.__version__)"
        docker run --rm --entrypoint scraw-fd-open-data-mcp "$IMG" --help > /dev/null
        echo "smoke ok: $IMG"
