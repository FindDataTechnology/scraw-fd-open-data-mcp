apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-pool
  namespace: scraw
  labels:
    app: proxy-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy-pool
  template:
    metadata:
      labels:
        app: proxy-pool
    spec:
      containers:
      - name: proxy-pool
        image: jhao104/proxy_pool:latest
        ports:
        - containerPort: 5555
          name: api
        env:
        - name: DB_CONN
          value: "redis://proxy-pool-redis:6379/0"
        - name: PROXY_POOL_ENABLE
          value: "true"
        - name: PROXY_POOL_MAX_FETCH
          value: "50"
        - name: PROXY_FETCH_INTERVAL
          value: "300"  # 5 minutes
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5555
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5555
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-pool
  namespace: scraw
spec:
  selector:
    app: proxy-pool
  ports:
  - port: 5555
    targetPort: 5555
    protocol: TCP
  type: ClusterIP
