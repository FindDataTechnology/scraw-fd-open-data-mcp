apiVersion: batch/v1
kind: CronJob
metadata:
  name: proxy-pool-sync
  namespace: scraw
spec:
  schedule: "*/10 * * * *"  # Every 10 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600  # Keep completed jobs for 1 hour
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: proxy-pool-sync
            image: harbor.local/lawcraw_business/scraw-fd-open-data-mcp:proxy-health
            command: ["python", "/scripts/proxy_pool_sync.py"]
            env:
            - name: FD_OPEN_DATA_MCP_DATABASE_URL
              value: postgresql+psycopg2://postgres:admin123@fd-open-pg.scraw:5432/postgres
            - name: PROXY_FETCH_COUNT
              value: "50"
            - name: PROXY_VALIDATION_TIMEOUT
              value: "10"
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
            volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          volumes:
          - name: script
            configMap:
              name: proxy-pool-sync-script
