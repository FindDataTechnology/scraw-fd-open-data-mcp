[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scraw-fd-open-data-mcp"
version = "0.1.0"
description = "Unified concept-driven Scrapy crawler for fd-open-data-mcp (crawl + migrate modes)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "scrapy>=2.12,<2.13",  # 2.13+ broke start_requests + sync download_handler (matches Dockerfile)
    "Twisted<25",  # 25+ removed _setAcceptableProtocols that scrapy 2.12 needs (matches Dockerfile)
    "scrapy-redis>=0.7.3",
    "scrapyd>=1.3",
    "scrapyd-client>=1.3",
    "redis>=5",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "fd-open-data-protocol",
    "fd-open-data-mcp",
]

[project.entry-points."scrapy"]
settings = "scraw_fd_open_data_mcp.settings"

[project.scripts]
scraw-fd-open-data-mcp = "scraw_fd_open_data_mcp.cli:main"

[tool.uv.sources]
fd-open-data-protocol = { path = "../fd-open-data-protocol" }
fd-open-data-mcp = { path = "../fd-open-data-mcp" }

[tool.setuptools.packages.find]
include = ["scraw_fd_open_data_mcp*"]
