# ⚠ 同一对象在 fd-open-data-mcp 仓也有一份清单（k8s/fd-master/NN-*.yaml）。
#   两份都按 2026-11-14 的 live spec 对齐过（此前有 4 处陈旧：镜像 tag、
#   imagePullPolicy、env 里的 SCRAW_K8S_IMAGE、缺 FD_RETENTION_GATE）。
#   apply 任何一份之前先 `kubectl -n fd-master diff -f <file>`：这个对象的
#   generation 已经到几十，live 是被人就地 patch 过的，仓里永远要重新对一次。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fd-proxy-probe
  namespace: fd-master
  labels:
    app: fd-proxy-probe
spec:
  schedule: "*/1 * * * *"   # every minute; tune per source (design.md open Q)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Hard cap: a hung probe fetch (e.g. yfinance's Yahoo retry dance behind
      # a slow shared exit) must not block every later cycle under Forbid.
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
          - name: fd-harbor-pull
          containers:
          - name: probe
            image: ccr.ccs.tencentyun.com/finddata/scraw-fd-open-data-mcp:sha-e157799
            # IfNotPresent: this tag is currently node-imported (k3s ctr) — the
            # Harbor push is pending fresh push credentials after the 2026-09-17
            # Harbor refactor. Always would ImagePullBackOff until it lands.
            imagePullPolicy: IfNotPresent
            command: ["python", "-m", "fd_open_data_mcp.probe.job"]
            env:
            - name: FD_OPEN_DATA_MCP_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: fd-db-secret, key: DATABASE_URL}
            # Circuit state lives in the forwarder's proxy-redis (db1): the
            # probe must scan what proxy-fw /release wrote, so PROXY_REDIS_URL
            # (which wins over REDIS_URL in proxy/circuit.py) points there.
            - name: PROXY_REDIS_URL
              valueFrom:
                secretKeyRef: {name: fd-db-secret, key: PROXY_REDIS_URL_CONTROL}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: {name: fd-db-secret, key: REDIS_URL}  # fallback; db0
            - name: PYTHONUNBUFFERED
              value: "1"
            resources:
              requests: {memory: "128Mi", cpu: "100m"}
              limits: {memory: "512Mi", cpu: "500m"}
