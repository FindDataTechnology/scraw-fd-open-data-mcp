apiVersion: batch/v1
kind: CronJob
metadata:
  name: retention-audit
  namespace: fd-master
  labels:
    app: retention-audit
    domain: fd-open-data
spec:
  # 每天 05:20 CST（= 21:20Z 前一天）。刻意避开爬虫作业窗口：06:37Z/06:52Z/10:35Z/13:37Z。
  schedule: "20 5 * * *"
  timeZone: Asia/Shanghai
  # 上一轮没跑完就不叠新一轮——淘汰工具会搬行，并发两轮会互相对不上账。
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 172800
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: fd-harbor-pull
          containers:
            - name: retention
              # 脚本直接用镜内的 /app/scripts（`COPY . /app` 放本仓 scripts/，再叠
              # fodm-src 的 bulk-ingest 脚本，名字不重叠）。FD_ODM_REF 已抬到 9221ec2，
              # 镜内的 audit/evict 都是含 T 分支粒度修复的版本——2026-11-13 在镜内实测过：
              #   PARTITION BY o.concept_id, o.entity_type, o.entity_id, o.granularity
              # 两个脚本必须同目录（evict 按 `__file__` 同目录 importlib 加载 audit）。
              # 2026-11-13 再抬一次（sha-eb366d0 → sha-ebd254a，FD_ODM_REF=9221ec2）：
              # 只为带上审计新增的 `date_not_iso` 判定——date 是 varchar，W 的淘汰与 T 的
              # 取最新都靠字符串序，一个 `LATEST` 混进 W 就永不淘汰、混进 T 就挤掉当期行。
              # 只滚这个 CronJob，**不动 clusters.image**：爬虫机队写入路径未改。
              image: ccr.ccs.tencentyun.com/finddata/scraw-fd-open-data-mcp:sha-ebd254a
              imagePullPolicy: IfNotPresent
              command: ["bash", "-c"]
              args:
                - |
                  set -u
                  DSN="$FD_OPEN_DATA_MCP_DATABASE_URL"
                  echo "=== 1/2 契约审计（只读；范围＝master 本地）==="
                  python /app/scripts/audit_retention_contracts.py --db-url "$DSN"
                  a=$?
                  echo "audit exit=$a  (0=干净 1=容量违规 3=仅契约待补 2=未知)"
                  echo
                  echo "=== 2/2 窗口淘汰（搬进隔离区，可逆；带行数对账）==="
                  python /app/scripts/evict_retention_window.py --db-url "$DSN" \
                      --apply --batch-size 5000 --limit-rows 100000
                  e=$?
                  echo "evict exit=$e  (0=无待淘汰 1=有待淘汰/已执行 2=失败)"
                  # 退出码 1 的语义是"有待淘汰且已搬完"，是**有活干**不是失败；
                  # 照原样交给 CronJob 就会每天报 Failed，红久了就没人看红。
                  case "$e" in 0|1) e=0 ;; esac
                  # 3 = 新族还没声明契约。医药域在建新族时会常态出现，不判失败但留痕；
                  # 1（容量违规）与 2（未知）必须红——"未知不等于通过"。
                  case "$a" in 3) echo "WARN 仅有契约待补（新族在建，不判失败）"; a=0 ;; esac
                  echo
                  echo "=== 3/3 隔离区体量（涨得快＝契约或写入出了问题，不是垃圾）==="
                  # 隔离区**不设过期**：它的全部价值就是"可逆"。所以它必须可见——
                  # 没人报体量的话，它涨到多大都不会有人知道。纯报表，`|| true` 兜底，
                  # 绝不因为它把作业判红。
                  python - <<'QEOF' || echo "（隔离区统计失败，不影响作业结论）"
                  import os
                  from sqlalchemy import create_engine, text
                  eng = create_engine(os.environ["FD_OPEN_DATA_MCP_DATABASE_URL"])
                  with eng.connect() as c:
                      # 隔离表是**两个**工具共用的：留存淘汰（batch_id 以 retention- 开头）
                      # 与错挂行的隔离（其它批次）。混在一起报，会让人以为 F 类也被淘汰过。
                      rows = c.execute(text("""
                          select case when q.batch_id like 'retention-%' then 'retention'
                                      else 'other' end as origin,
                                 coalesce(ct.retention_class,'?') as cls,
                                 count(*) as n
                            from semantic_observations_quarantine q
                            left join concepts co on co.id = q.concept_id
                            left join data_retention_contracts ct
                              on ct.source = q.source_used
                             and ct.family = split_part(co.code,'.',1)
                           group by 1, 2 order by 1, 3 desc""")).all()
                      total = sum(r[2] for r in rows)
                      print("  合计 %d 行 ≈ %.0f MB" % (total, total * 355 / 1024 / 1024))
                      for origin, label in (
                              ("retention", "留存淘汰（按类；这里出现 F/P 才异常）"),
                              ("other", "其它隔离（错挂行等，非留存造成）")):
                          sub = [(cls, n) for (o, cls, n) in rows if o == origin]
                          if not sub:
                              continue
                          print("  -- %s" % label)
                          for cls, n in sub:
                              print("     %-3s %10d" % (cls, n))
                  QEOF
                  echo
                  echo "=== 4/4 分片体量（执行面之外的 98.5%；只读，慢=正常）==="
                  # 上面 1/2、2/2 与 3/3 全都只看 master 本地 `semantic_observations`。
                  # 两个分片上的行对审计与淘汰**不存在**：2026-11-13 实测
                  #   ft_sem_obs_xinru2 20,120,615（akshare 19,559,474 + akshare_misbound 561,141）
                  #   ft_sem_obs_xinru3 48,316,490（astock_daily）
                  # 而 master 只有 1,042,939——也就是说"窗口已执行"只覆盖语料的 1.5%。
                  # 这一段不改任何东西，只让那 98.5% **有读数**：没有它，分片涨到多大都没人知道，
                  # 而"要不要把淘汰扩到分片"这个决定缺了分母就永远谈不成。
                  # 给 240s 上限：FDW 全表扫描本来慢，但绝不允许它把整轮作业拖死。
                  # `|| true` 兜底——分片不可达是分片的事，不是留存作业的结论。
                  python - <<'SEOF' || echo "（分片统计失败或超时，不影响作业结论）"
                  import os
                  from sqlalchemy import create_engine, text
                  eng = create_engine(os.environ["FD_OPEN_DATA_MCP_DATABASE_URL"])
                  FTS = (("xinru2", "ft_sem_obs_xinru2"), ("xinru3", "ft_sem_obs_xinru3"))
                  grand = 0
                  for shard, ft in FTS:
                      with eng.connect() as c:
                          # 每个分片单独一个连接与上限：一个分片挂了不该拖累另一个。
                          c.execute(text("set statement_timeout='240s'"))
                          try:
                              rows = c.execute(text(
                                  "select source_used, count(*) n from %s "
                                  "group by 1 order by 2 desc limit 6" % ft)).all()
                          except Exception as exc:  # noqa: BLE001
                              print("  %s: 读不到（%s）" % (shard, str(exc).splitlines()[0][:60]))
                              continue
                          tot = sum(int(r[1]) for r in rows)
                          grand += tot
                          print("  -- %s（%s）合计 %d 行" % (shard, ft, tot))
                          for src, n in rows:
                              print("     %-22s %10d" % (src, n))
                  print("  分片合计 %d 行（master 本地 1,042,939 不计入；后者才是审计/淘汰看得到的）" % grand)
                  SEOF
                  [ "$a" -ne 0 ] && exit "$a"
                  exit "$e"
              env:
                - name: FD_OPEN_DATA_MCP_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: fd-db-secret
                      key: DATABASE_URL
                - name: PYTHONUNBUFFERED
                  value: "1"
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 1Gi}
