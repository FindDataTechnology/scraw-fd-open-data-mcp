apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scraw-fd-open-data-mcp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  # Source configuration
  source:
    repoURL: https://github.com/FindDataOfficial/scraw-fd-open-data-mcp.git
    targetRevision: HEAD
    path: k8s
    
  # Destination configuration
  destination:
    server: https://kubernetes.default.svc
    namespace: fd-open-data
    
  # Sync policy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
