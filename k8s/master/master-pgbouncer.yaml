# Stable DB endpoint for the fleet (add-multi-cluster-master-db).
#
# PgBouncer was dropped (YAGNI): a 4-server fleet with SQLAlchemy-pooled worker
# pods opens ~20-40 server connections, well under Postgres's default
# max_connections=100. PgBouncer's md5/scram auth-config was a failure mode for
# no real benefit at this scale. Re-add a transaction pooler only if connection
# churn against master-postgres becomes measurable.
#
# Workers + the reconciler point FD_OPEN_DATA_MCP_DATABASE_URL at THIS Service
# (master-pg), so the backing pod can change without touching consumers.
apiVersion: v1
kind: Service
metadata:
  name: master-pg
  namespace: fd-master
  # FD_OPEN_DATA_MCP_DATABASE_URL=
  #   postgresql+psycopg2://postgres:<PW>@master-pg.fd-master:5432/fd_open_data
spec:
  selector:
    app: master-postgres
  ports:
  - port: 5432
    targetPort: 5432
    name: pg
  type: ClusterIP
