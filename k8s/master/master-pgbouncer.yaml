# PgBouncer in front of master-postgres (add-multi-cluster-master-db).
#
# A multi-cluster fleet opens many short-lived worker connections (one per crawl Job
# pod, each with its own SQLAlchemy pool). PgBouncer in transaction mode multiplexes
# them onto a small server-side pool so master-postgres isn't starved by connection
# churn - important when workers sit across the Pacific from the US master.
#
# Workers point FD_OPEN_DATA_MCP_DATABASE_URL at THIS Service (master-pg:5432),
# NOT master-postgres directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: master-pgbouncer
  namespace: fd-master
  labels:
    app: master-pgbouncer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: master-pgbouncer
  template:
    metadata:
      labels:
        app: master-pgbouncer
    spec:
      containers:
      - name: pgbouncer
        image: edoburu/pgbouncer:1.23.1
        env:
        - name: DB_HOST
          value: master-postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: postgres
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: {name: master-db-secret, key: POSTGRES_PASSWORD}
        - name: DB_NAME
          value: fd_open_data
        - name: POOL_MODE
          value: transaction
        - name: MAX_CLIENT_CONN
          value: "500"   # fan-in from all worker pods across all clusters
        - name: DEFAULT_POOL_SIZE
          value: "25"   # server-side conns to master-postgres
        - name: AUTH_TYPE
          value: trust  # PgBouncer is in-cluster; auth is the worker->PgBouncer hop's job
        ports:
        - containerPort: 5432
          name: pg
        resources:
          requests: {memory: "64Mi", cpu: "50m"}
          limits: {memory: "256Mi", cpu: "250m"}
        livenessProbe:
          tcpSocket: {port: 5432}
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket: {port: 5432}
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: master-pg
  namespace: fd-master
  # This is the endpoint workers use: FD_OPEN_DATA_MCP_DATABASE_URL=
  #   postgresql+psycopg2://postgres:<PW>@master-pg.fd-master:5432/fd_open_data
spec:
  selector:
    app: master-pgbouncer
  ports:
  - port: 5432
    targetPort: 5432
    name: pg
  type: ClusterIP
