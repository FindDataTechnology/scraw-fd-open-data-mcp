apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-pool-redis
  namespace: scraw
  labels:
    app: proxy-pool-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy-pool-redis
  template:
    metadata:
      labels:
        app: proxy-pool-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-pool-redis
  namespace: scraw
spec:
  selector:
    app: proxy-pool-redis
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
  type: ClusterIP
