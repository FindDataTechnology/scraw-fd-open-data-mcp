apiVersion: batch/v1
kind: CronJob
metadata:
  name: fd-proxy-probe
  namespace: fd-master
  labels:
    app: fd-proxy-probe
spec:
  schedule: "*/1 * * * *"   # every minute; tune per source (design.md open Q)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
          - name: fd-harbor-pull
          containers:
          - name: probe
            image: 100.64.0.8:30880/finddata/scraw-fd-open-data-mcp:sha-d1c7a78
            # IfNotPresent: this tag is currently node-imported (k3s ctr) — the
            # Harbor push is pending fresh push credentials after the 2026-09-17
            # Harbor refactor. Always would ImagePullBackOff until it lands.
            imagePullPolicy: IfNotPresent
            command: ["python", "-m", "fd_open_data_mcp.probe.job"]
            env:
            - name: FD_OPEN_DATA_MCP_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: fd-db-secret, key: DATABASE_URL}
            # Circuit state lives in the forwarder's proxy-redis (db1): the
            # probe must scan what proxy-fw /release wrote, so PROXY_REDIS_URL
            # (which wins over REDIS_URL in proxy/circuit.py) points there.
            - name: PROXY_REDIS_URL
              valueFrom:
                secretKeyRef: {name: fd-db-secret, key: PROXY_REDIS_URL_CONTROL}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: {name: fd-db-secret, key: REDIS_URL}  # fallback; db0
            - name: PYTHONUNBUFFERED
              value: "1"
            resources:
              requests: {memory: "128Mi", cpu: "100m"}
              limits: {memory: "512Mi", cpu: "500m"}
